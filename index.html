.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6}

.ok{display:inline-block;background:var(--mat);color:#26280a;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800}

function proj(W,H){const m=S.mv,pp=W/m.sp;return{X:lo=>(lo-m.lon)*pp+W/2,Y:la=>(m.lat-la)*pp*1.37+H/2,lo:x=>m.lon+(x-W/2)/pp,la:y=>m.lat-(y-H/2)/(pp*1.37)}}
const el=(la,lo)=>.5+.25*Math.sin(lo*38+1)*Math.cos(la*31)+.2*Math.sin(lo*71+la*53)+.1*Math.sin(la*97-lo*23);

all().forEach(r=>line(r,okR(r)?'#3a6ea5':'#8d8d98',rn(r)));if(S.ca&&S.cb)line({a:S.ca,b:S.cb},'#E36888');
g.font='19px sans-serif';g.textAlign='center';g.textBaseline='middle';P.filter(q=>S.lay[q[2]]).forEach(q=>{g.fillStyle='#fffbee';g.beginPath();g.arc(p.X(q[1]),p.Y(q[0]),14,0,7);g.fill();g.fillText(ICO[q[2]],p.X(q[1]),p.Y(q[0])+1)});
[S.ca,S.cb].forEach((q,i)=>{if(q){g.fillStyle='#F08C21';g.beginPath();g.arc(p.X(q[1]),p.Y(q[0]),10,0,7);g.fill();g.fillStyle='#fff';g.font='bold 12px sans-serif';g.fillText(i?'B':'A',p.X(q[1]),p.Y(q[0]))}});
if(S.gps){const x=p.X(S.gps.lon),y=p.Y(S.gps.lat);g.fillStyle='rgba(227,104,136,.35)';g.beginPath();g.arc(x,y,20,0,7);g.fill();g.fillStyle='#E36888';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(x,y,8,0,7);g.fill();g.stroke()}}
function mapEvents(cv){let d=null;cv.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,m:0};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.abs(dx)+Math.abs(dy)>5)d.m=1;if(d.m){const W=cv.clientWidth,pp=W/S.mv.sp;S.mv.lon-=dx/pp;S.mv.lat+=dy/(pp*1.37);d.x=e.clientX;d.y=e.clientY;drawMap()}};
cv.onpointerup=e=>{if(d&&!d.m&&(S.pick==1||S.pick==2)){const b=cv.getBoundingClientRect(),W=cv.clientWidth,p=proj(W,Math.round(W*1.05)),pt=[p.la(e.clientY-b.top),p.lo(e.clientX-b.left)];if(S.pick==1){S.ca=pt;S.pick=2;drawMap()}else{S.cb=pt;S.pick=3;draw()}}d=null};cv.onwheel=e=>{e.preventDefault();S.mv.sp=Math.min(1.5,Math.max(.02,S.mv.sp*(e.deltaY>0?1.2:.83)));drawMap()}}
// ---------- sensors
let ffS=0,arm=0,gT=0,wid=null,mic=null,sr=null,tm=null,ac=null,so=null;
function watch(){if(wid!=null||!navigator.geolocation)return;try{wid=navigator.geolocation.watchPosition(p=>{S.gerr=0;S.gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,alt:p.coords.altitude};sv();if(!S.sos&&(S.tab=='home'||S.tab=='map')&&!document.activeElement.matches('input,select'))draw()},()=>{S.gerr=1;if(S.tab=='home')draw()},{enableHighAccuracy:true,maximumAge:5000})}catch(e){S.gerr=1}}
function mot(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const g=Math.hypot(a.x,a.y,a.z)/9.81,n=Date.now();S.g=g;if(g>S.pk)S.pk=g;if(!S.sup){S.sup=1;if(S.tab=='home')draw()}
if(n-gT>250){gT=n;const x=document.getElementById('gv');if(x)x.textContent=g.toFixed(1)+' g';const k=document.getElementById('pk');if(k)k.textContent=S.pk.toFixed(1)+' g'}
if(S.sos||!S.o.fall)return;const c=[[.25,150,4,6.5],[.35,120,3,5],[.5,100,2.2,4]][S.o.sens];
if(g<c[0]){if(!ffS)ffS=n}else{if(ffS&&n-ffS>=c[1])arm=n;ffS=0}if(arm&&n-arm>1500)arm=0;
if((arm&&g>=c[2])||g>=c[3]){arm=0;S.hit=g;startSOS('fall')}}
function startMic(){if(mic||!S.o.scream||!navigator.mediaDevices)return;navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,autoGainControl:false,noiseSuppression:false}}).then(st=>{unlock();const s=ac.createMediaStreamSource(st),an=ac.createAnalyser();an.fftSize=1024;s.connect(an);const b=new Uint8Array(1024);let hi=0,pkv=0;S.mic=1;mic={st,t:setInterval(()=>{an.getByteTimeDomainData(b);let m=0;for(const v of b)m=Math.max(m,Math.abs(v-128)/128);S.lv=Math.round(m*100);const e=document.getElementById('lv');if(e)e.textContent=S.lv+'%';if(m>.6){hi++;pkv=Math.max(pkv,S.lv)}else{hi=0;pkv=0}if(hi>=7&&!S.sos){hi=0;S.slv=pkv;startSOS('scream')}},100)};if(S.tab=='home')draw()}).catch(()=>{S.mic=0;if(S.tab=='home')draw()})}
function startSR(){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(sr||!S.o.kw)return;if(!C){S.sr=0;return}const r=new C();r.continuous=true;r.interimResults=true;r.lang=['ru-RU','kk-KZ','en-US'][S.lang];r.onstart=()=>{S.sr=1;if(S.tab=='home')draw()};
r.onresult=e=>{const t=Array.from(e.results).slice(e.resultIndex).map(x=>x[0].transcript.toLowerCase()).join(' '),w=S.o.kws.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);if(!S.sos&&w.some(x=>t.includes(x)))startSOS('kw')};
r.onerror=()=>{S.sr=0};r.onend=()=>{if(sr&&S.mtn&&S.o.kw)try{r.start()}catch(e){}};sr=r;try{r.start()}catch(e){S.sr=0}}
function sensors(force){if(mic){clearInterval(mic.t);mic.st.getTracks().forEach(t=>t.stop());mic=null}if(sr){const r=sr;sr=null;try{r.stop()}catch(e){}}removeEventListener('devicemotion',mot);S.mic=S.sr=-1;
if(S.mtn&&force!==0){addEventListener('devicemotion',mot);watch();startMic();startSR()}}
async function toggleM(){unlock();S.mtn^=1;if(S.mtn){try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(e){}}S.tab='home';sensors();draw()}
// ---------- SOS
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}addEventListener('pointerdown',unlock);
function beep(){try{navigator.vibrate&&navigator.vibrate(250)}catch(e){}if(!ac||!S.o.siren)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.value=988;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.45)}
function siren(on){if(so){try{so.o.stop()}catch(e){}clearInterval(so.t);so=null}if(!on||!S.o.siren||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),u=.17,Q=[[1,1],[1,1],[1,3],[3,1],[3,1],[3,3],[1,1],[1,1],[1,9]];o.type='sine';o.frequency.value=1100;g.gain.value=0;o.connect(g);g.connect(ac.destination);o.start();const len=Q.reduce((s,x)=>s+x[0]+x[1],0)*u,run=()=>{let t=ac.currentTime+.05;for(const[a,b]of Q){g.gain.setTargetAtTime(.22,t,.01);g.gain.setTargetAtTime(0,t+a*u,.01);t+=(a+b)*u}};run();so={o,t:setInterval(run,len*1000)}}
function msg(w){const g=S.gps,c=g?`${g.lat.toFixed(5)},${g.lon.toFixed(5)}${g.alt!=null?', '+Math.round(g.alt)+' m':''} (±${Math.round(g.acc)} m) https://maps.google.com/?q=${g.lat},${g.lon}`:T('координаты неизвестны','координаттар белгісіз','location unknown'),a=S.alg.concat(S.chr).join(', ');
return `${w=='share'?'TauSafe':'SOS!'} ${esc(S.name)}, ${S.age}. ${w=='share'?'':T('Нужна помощь в горах.','Тауда көмек керек.','Needs help in the mountains.')} ${c}${S.bat!=null?` 🔋${S.bat}%`:''}${S.bt?` | ${S.bt}`:''}${a?` | ${a}`:''}${S.meds?` | ${S.meds}`:''}${S.trip?` | ${T('маршрут','маршрут','route')}: ${rn(all().find(x=>x.id==S.trip.r)||R[0])}`:''}`.replace(/&amp;/g,'&')}
const smsH=()=>`sms:${S.cts.map(c=>c.p.replace(/[^\d+]/g,'')).join(',')}?body=${encodeURIComponent(msg())}`;
function startSOS(w){if(S.sos)return;unlock();watch();const p=w=='kw'||w=='need'?2:1;S.sos={ph:p,left:p==1?S.o.wait:30,tot:p==1?S.o.wait:30,w};if(p==2)sendAll();ovr();clearInterval(tm);tm=setInterval(tick,1000);siren(p==2)}
function sendAll(){try{const a=document.createElement('a');a.href=smsH();a.click()}catch(e){}}
function tick(){const s=S.sos;if(!s)return;s.left--;if(s.ph==1){beep();if(s.left<=0){s.ph=2;s.left=30;s.tot=30;sendAll();siren(true)}}else if(s.left<=0){clearInterval(tm);location.href='tel:112'}ovr()}
function stopSOS(){clearInterval(tm);siren(false);S.sos=0;S.hit=0;$('#ov').style.display='none'}
function ovr(){const s=S.sos,o=$('#ov'),C=553,off=C*(1-s.left/s.tot);o.style.display='flex';
o.innerHTML=`<div class="ch">${reasonT(s.w)}</div><h2>${s.ph==1?T('ВЫ В ПОРЯДКЕ?','БӘРІ ЖАҚСЫ МА?','ARE YOU OK?'):T('СИГНАЛ ОТПРАВЛЕН','СИГНАЛ ЖІБЕРІЛДІ','SIGNAL SENT')}</h2><div style="opacity:.85;font-weight:700">${s.ph==1?T('Бәрі жақсы ма?','Вы в порядке?','Бәрі жақсы ма?'):T('Звонок 112 через','112-ге қоңырау','Calling 112 in')}</div>
<svg width="220" height="220" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="14"/><circle cx="100" cy="100" r="88" fill="none" stroke="#fff6dc" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 100 100)"/><text x="100" y="125" text-anchor="middle" font-size="76" font-weight="900" fill="#fff">${s.left}</text></svg>
<p style="margin:0;max-width:380px">${s.ph==1?T('Если не ответите, близкие получат SOS с координатами и медкартой, включится сирена.','Жауап бермесеңіз, жақындарға координата мен медкарта жіберіледі, сирена қосылады.','No answer: contacts get SOS with location and medical card, and a siren starts.'):T('Близким отправлено. Сирена помогает найти вас. Нажмите, если всё в порядке.','Жақындарға жіберілді. Сирена сізді табуға көмектеседі. Жағдайыңыз жақсы болса басыңыз.','Contacts alerted. The siren helps rescuers find you. Tap if you are fine.')}</p>
<button class="o1" id="iok">✔ ${T('Я В ПОРЯДКЕ','МЕН ЖАҚСЫМЫН','I AM OK')}</button>${s.ph==1?`<button class="o2" id="ineed">🚨 ${T('НУЖНА ПОМОЩЬ','КӨМЕК КЕРЕК','I NEED HELP')}</button>`:`<a class="o3" href="${smsH()}">💬 ${T('Отправить SMS ещё раз','SMS қайта жіберу','Resend SMS')}</a>`}<a class="o3" href="tel:112">☎️ ${T('Позвонить 112 сейчас','112-ге қазір қоңырау','Call 112 now')}</a>`;
$('#iok').onclick=stopSOS;const n=$('#ineed');if(n)n.onclick=()=>{s.ph=2;s.left=30;s.tot=30;sendAll();siren(true);ovr()}}
// ---------- misc
setInterval(()=>{if(S.trip&&!S.sos&&Date.now()>S.trip.dl){S.trip=null;startSOS('late')}},5000);
addEventListener('online',()=>{const n=$('#net');if(n)n.textContent='📶'});addEventListener('offline',()=>{const n=$('#net');if(n)n.textContent='📴'});
try{navigator.getBattery&&navigator.getBattery().then(b=>{S.bat=Math.round(b.level*100)})}catch(e){}
document.documentElement.lang=['ru','kk','en'][S.lang];if(S.mtn)sensors();draw();addEventListener('resize',()=>{if(S.tab=='map')drawMap()});
</script></body></html>
